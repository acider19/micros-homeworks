static_resources:
  listeners:
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 6390
    filter_chains:
    - filters:
      - name: envoy.filters.network.redis_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
          stat_prefix: redis
          settings:
            op_timeout: 5s
            enable_redirection: true
          prefix_routes:
            catch_all_route:
              cluster: redis_cluster
          downstream_auth_password:
            inline_string: "redis-secret"
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 6391
    filter_chains:
    - filters:
      - name: envoy.filters.network.redis_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
          stat_prefix: redis_tls
          settings:
            op_timeout: 5s
            enable_redirection: true
          prefix_routes:
            catch_all_route:
              cluster: redis_cluster_tls
          downstream_auth_password:
            inline_string: "redis-secret"

  clusters:
  - name: redis_cluster
    connect_timeout: 1s
    cluster_type:
      name: envoy.clusters.redis
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.redis.v3.RedisClusterConfig
        cluster_refresh_rate: 1s
        cluster_refresh_timeout: 3s
    lb_policy: CLUSTER_PROVIDED
    load_assignment:
      cluster_name: redis_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.86
                port_value: 6379
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.59
                port_value: 6379
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.161
                port_value: 6379

  - name: redis_cluster_tls
    connect_timeout: 1s
    cluster_type:
      name: envoy.clusters.redis
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.redis.v3.RedisClusterConfig
        cluster_refresh_rate: 1s
        cluster_refresh_timeout: 3s
    lb_policy: CLUSTER_PROVIDED
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: redis-cluster
    load_assignment:
      cluster_name: redis_cluster_tls
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.86
                port_value: 6379
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.59
                port_value: 6379
        - endpoint:
            address:
              socket_address:
                address: 192.168.139.161
                port_value: 6379

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
