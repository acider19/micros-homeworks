[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    Parser           cri
    Mem_Buf_Limit    5MB

[FILTER]
    Name             kubernetes
    Match            kube.*
    Kube_URL         https://kubernetes.default.svc:443

[OUTPUT]
    Name             es
    Match            *
    Host             elasticsearch
    Port             9200
    Index            logs-${namespace}
    Type             _doc
