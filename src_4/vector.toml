[sources.docker_logs]
  type = "docker_logs"
  docker_host = "unix:///var/run/docker.sock"

[transforms.parse]
  type = "remap"
  inputs = ["docker_logs"]
  source = '''
    .service = .container_name
    del(.label)
    del(.stream)
  '''

[sinks.elasticsearch]
  type = "elasticsearch"
  inputs = ["parse"]
  endpoints = ["http://elasticsearch:9200"]
  bulk.index = "vector-%F"
