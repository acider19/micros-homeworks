global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'security-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['security:5000']

  - job_name: 'uploader-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['uploader:5001']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
