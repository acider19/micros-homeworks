stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: registry.gitlab.com/$CI_PROJECT_PATH

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test:unit:
  stage: test
  image: $DOCKER_IMAGE:$CI_COMMIT_SHA
  script:
    - pytest tests/unit --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
  parallel: 3

test:integration:
  stage: test
  image: $DOCKER_IMAGE:$CI_COMMIT_SHA
  services:
    - postgres:15
    - redis:7
  script:
    - pytest tests/integration

deploy:staging:
  stage: deploy
  environment:
    name: staging
  script:
    - kubectl set image deployment/$SERVICE $SERVICE=$DOCKER_IMAGE:$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
